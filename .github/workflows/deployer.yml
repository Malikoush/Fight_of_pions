# Le déploiement automatique (E4h, docs/DEPLOIEMENT.md).
#
# À chaque push sur `main` :
#   1. « verifier » : format, clippy et tests du moteur et du serveur ;
#   2. « jeu-web » : tests du client, puis export web avec Godot et précompression ;
#   3. « image » (si les deux passent) : l'image Docker complète, serveur et jeu web,
#      publiée sur ghcr.io/<propriétaire>/fight_of_pions (étiquettes `latest` et `sha-…`).
# Sur l'OptiPlex, Watchtower voit la nouvelle `latest` et relance le serveur.
#
# Une demande de fusion (pull request) passe les vérifications sans rien publier. Aucun test
# ne fait jouer un bot : ceux-là sont marqués `#[ignore]`, et le paquet des bots n'est que
# compilé (par clippy).

name: Déployer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un seul déploiement à la fois : un push récent remplace celui qui était en cours.
concurrency:
  group: deployer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `bash` nommé explicitement : GitHub y ajoute `pipefail`, pour qu'une commande qui échoue
# avant un `| tee` fasse quand même échouer l'étape.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # La version de Godot du projet (client-godot/project.godot) ; ses modèles d'export
  # doivent être exactement de la même version.
  GODOT_VERSION: 4.7.2

jobs:
  verifier:
    name: Moteur et serveur
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Les dépendances compilées, gardées d'un passage à l'autre.
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # Le labo (eframe) n'est pas déployé : il n'est vérifié que sur la machine de Martin.
      - name: Clippy
        run: cargo clippy -p fight_of_pions -p bots -p serveur -p terminal --all-targets -- -D warnings
      - name: Tests du moteur et du serveur
        run: cargo test -p fight_of_pions -p serveur

  jeu-web:
    name: Client Godot et export web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Godot et son modèle d'export web (sans threads, comme le préréglage « Web »), gardés
      # d'un passage à l'autre : l'archive des modèles pèse environ 1 Go.
      - name: Godot en cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Télécharger Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/modeles.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          modeles=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$modeles"
          unzip -q -j /tmp/modeles.tpz templates/web_nothreads_release.zip templates/version.txt -d "$modeles"
          rm /tmp/godot.zip /tmp/modeles.tpz
      # Une copie neuve du projet n'a pas encore son cache (.godot/) : l'importer d'abord,
      # pour que les classes nommées et les `uid://` (l'autoload ServerLink) soient connus
      # des tests et de l'export. Le premier import d'un projet neuf peut s'arrêter en
      # route (essayé le 2026-11-11 : il plante sur une police) ; le second finit le travail
      # et doit réussir.
      - name: Importer le projet
        run: |
          ~/godot/godot --headless --path client-godot --import || echo "Premier import interrompu : on recommence."
          ~/godot/godot --headless --path client-godot --import
      - name: Tests du client
        run: ~/godot/godot --headless --path client-godot --script res://tests/run_tests.gd
      # Godot sort avec 0 même si un script ne se compile pas : sa sortie est relue, et
      # toute erreur de script fait échouer l'export.
      - name: Export web
        run: |
          mkdir -p client-godot/export/web
          ~/godot/godot --headless --path client-godot --export-release "Web" export/web/index.html 2>&1 | tee /tmp/export.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/export.log; then
            echo "L'export a des erreurs de script."
            exit 1
          fi
          test -s client-godot/export/web/index.html
          test -s client-godot/export/web/index.wasm
          test -s client-godot/export/web/index.pck
      - name: Précompresser
        run: python3 outils/precompresser_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: jeu-web
          path: client-godot/export/web
          retention-days: 7

  image:
    name: Image Docker
    needs: [verifier, jeu-web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jeu-web
          path: client-godot/export/web
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Le nom de l'image, en minuscules (exigé par le registre) : `latest` pour Watchtower,
      # et le commit (`sha-1a2b3c4`) pour revenir à une version précise.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fight_of_pions
          tags: |
            type=raw,value=latest
            type=sha
      # Les couches déjà construites sont gardées par GitHub : si seul le jeu web change, le
      # serveur n'est pas recompilé.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
