[workspace]
members = ["moteur", "terminal", "labo"]
# `cargo test` et `cargo run` à la racine ne compilent jamais le labo (eframe) :
# `cargo run` lance le terminal, `cargo labo` le labo.
default-members = ["moteur", "terminal"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Backend glow (OpenGL) : bien plus léger à compiler que wgpu.
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }

# Les dépendances sont optimisées une fois pour toutes ; notre code reste en opt-level 0
# pour recompiler le plus vite possible.
[profile.dev.package."*"]
opt-level = 2
