[workspace]
members = ["moteur", "terminal", "labo", "bots"]
# `cargo test` et `cargo run` à la racine ne compilent jamais le labo (eframe) :
# `cargo run` lance le terminal, `cargo labo` le labo, `cargo arene` l'arène des bots.
# Les bots sont une bibliothèque (l'arène est un exemple) : `cargo test` les vérifie, et
# `cargo run` n'a toujours qu'un seul binaire à lancer.
default-members = ["moteur", "terminal", "bots"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Backend glow (OpenGL) : bien plus léger à compiler que wgpu.
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow"] }
# Sauvegarde des parties en JSON : optionnel dans le moteur, activé par le labo seulement.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Les dépendances sont optimisées une fois pour toutes ; le labo et le terminal restent
# en opt-level 0 pour recompiler le plus vite possible.
[profile.dev.package."*"]
opt-level = 2

# Le moteur et les bots sont optimisés même en debug : le labo simule à vitesse utile et
# les tests tournent plus vite. Les contrôles de débordement restent actifs. Pour suivre
# le moteur pas à pas dans un débogueur, commenter ces deux blocs le temps du débogage.
[profile.dev.package.fight_of_pions]
opt-level = 3

[profile.dev.package.bots]
opt-level = 3
